# ============================================================
# Qi Teng — Visitor Atlas · Worker config
# ------------------------------------------------------------
# 1. Replace database_id below with the id printed by:
#      npx wrangler d1 create qt-atlas
# 2. Deploy:
#      npx wrangler deploy
# ============================================================

name = "qt-atlas"
main = "atlas-worker.js"
compatibility_date = "2026-09-03"

# Keep the atlas responsive even if a visitor is on the far side of
# the world from the nearest D1 replica: reads are cached at the edge.
[[d1_databases]]
binding = "DB"
database_name = "qt-atlas"
database_id = "03afea88-6541-472d-b502-67d32821c503"

[vars]
# Comma separated. The first entry is also the CORS fallback.
ALLOWED_ORIGINS = "https://tengqi159.github.io,http://localhost:8000"

# Flip to "off" to stop collecting new dots without redeploying code.
RECORDING = "on"
