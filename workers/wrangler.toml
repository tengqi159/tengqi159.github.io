# ============================================================
# Qi Teng — Visitor Atlas · Worker config
# ------------------------------------------------------------
# 1. Replace database_id below with the id printed by:
#      npx wrangler d1 create qt-atlas
# 2. Deploy:
#      npx wrangler deploy
# ============================================================

name = "qt-atlas"
main = "atlas-worker.js"
compatibility_date = "2026-09-03"

# Aggregates are read from D1; responses are not cached across visitors.
[[d1_databases]]
binding = "DB"
database_name = "qt-atlas"
database_id = "03afea88-6541-472d-b502-67d32821c503"

[vars]
# Exact allowed browser origins, comma separated.
ALLOWED_ORIGINS = "https://tengqi159.github.io,http://localhost:8000,http://127.0.0.1:8765,http://localhost:8765"

# Flip to "off" to stop collecting new dots without redeploying code.
RECORDING = "on"
